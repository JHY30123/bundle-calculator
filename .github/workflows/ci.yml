name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    container: gradle:8.2-jdk17
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run tests
        run: gradle build --no-daemon
